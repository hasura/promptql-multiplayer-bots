<!doctype html>
<html lang="en" data-ui="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slides</title>
<script>try{document.documentElement.dataset.ui=localStorage.getItem('pql-slides-ui')||'light'}catch(e){}</script>
<script src="static/render.js"></script>
<script>document.write('<link rel="stylesheet" href="'+SlideKit.fontsHref()+'">')</script>
<link rel="stylesheet" href="static/slide.css">
<link rel="stylesheet" href="static/editor.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <input id="deckTitle" class="title-input" spellcheck="false" aria-label="Deck title">
    <span id="saveState" class="save-state">Loading…</span>
  </div>
  <div class="tools">
    <button id="undoBtn" class="btn ghost icon" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="redoBtn" class="btn ghost icon" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <span class="sep"></span>
    <button id="addTextBtn" class="btn ghost" title="Add text box"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>Text</button>
    <div class="menu-wrap">
      <button class="btn ghost" data-menu title="Add shape"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="10" height="10" rx="2"/><circle cx="15.5" cy="15.5" r="5.5"/></svg>Shape<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu left" id="shapeMenu">
        <button data-shape="rect">Rectangle</button>
        <button data-shape="rounded">Rounded rectangle</button>
        <button data-shape="ellipse">Ellipse</button>
        <button data-shape="pill">Pill</button>
        <button data-shape="line">Line</button>
      </div>
    </div>
    <button id="addImageBtn" class="btn ghost" title="Add image (or paste / drop one on the slide)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Image</button>
  </div>
  <div class="right">
    <select id="zoomSel" class="zoom" title="Zoom">
      <option value="fit">Fit</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option>
    </select>
    <button id="uiThemeBtn" class="btn ghost icon" title="Switch light / dark editor">
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="menu-wrap">
      <button class="btn" data-menu><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Export<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="menu" id="exportMenu">
        <button data-export="pptx">PowerPoint (.pptx)<small>Editable. Also opens in Google Slides and Keynote.</small></button>
        <button data-export="pdf">PDF<small>Pixel-faithful copy for sharing.</small></button>
        <button data-export="json">Deck JSON<small>Raw layers and theme, for backups or bots.</small></button>
        <div class="menu-h">Send to your account</div>
        <button data-push="gslides">Google Slides<small>Creates a new, editable deck in your Google Drive.</small></button>
        <button data-push="powerpoint">Microsoft PowerPoint<small>Saves a .pptx to OneDrive › PromptQL Slides.</small></button>
      </div>
    </div>
    <button id="presentBtn" class="btn primary" title="Present from the current slide"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>Present</button>
  </div>
</header>

<main class="workspace">
  <aside class="rail">
    <div id="thumbs" class="thumbs"></div>
    <div class="rail-add menu-wrap">
      <button class="btn wide" data-menu><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New slide</button>
      <div class="menu up" id="layoutMenu">
        <button data-layout="content">Heading and text<small>Section label, heading, body</small></button>
        <button data-layout="two">Two columns<small>Heading over two cards</small></button>
        <button data-layout="title">Title<small>Large title and subtitle</small></button>
        <button data-layout="section">Section break<small>Accent background</small></button>
        <button data-layout="blank">Blank</button>
      </div>
    </div>
  </aside>

  <section class="center">
    <div id="stage" class="stage">
      <div id="frame" class="frame">
        <div id="canvas"><div id="slideHost"></div><div id="overlay" class="overlay"></div></div>
      </div>
    </div>
    <div class="notes">
      <label for="notes">Speaker notes</label>
      <textarea id="notes" placeholder="Add notes for this slide. They show in present mode (press N) and export to PowerPoint."></textarea>
    </div>
  </section>

  <aside class="panel">
    <nav class="tabs">
      <button data-tab="design" class="on">Design</button>
      <button data-tab="format">Format</button>
      <button data-tab="layers">Layers</button>
    </nav>
    <div id="tab-design" class="tab on"></div>
    <div id="tab-format" class="tab"></div>
    <div id="tab-layers" class="tab"></div>
  </aside>
</main>

<div id="present" class="present" hidden>
  <div id="pStage" class="pstage"></div>
  <div id="pNotes" class="pnotes" hidden></div>
  <div class="pctl">
    <button id="pPrev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span id="pCount"></span>
    <button id="pNext" title="Next (→ or Space)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="pNotesBtn" title="Speaker notes (N)">Notes</button>
    <button id="pExit" title="Exit (Esc)">Exit</button>
  </div>
</div>

<div id="ctxMenu" class="ctxmenu" role="menu" hidden></div>
<div id="pushNote" class="pushnote" role="status" hidden></div>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" hidden>
<script src="static/editor.js"></script>
</body>
</html>
